name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # type-check + production bundle
      - run: npm test # Proxmox connector against a fake API

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rackscape:ci
      - name: Smoke test
        run: |
          docker run -d --name rs -p 8080:8080 rackscape:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<title>Rackscape</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/snapshot)" = 404
